<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Posicionamento e Display</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* estilos básicos */
        body {
            font-family: sans-serif;
            margin: 20px;
            padding-bottom: 200px;
        }

        h3 {
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
        }

        .caixa-position {
            border: 1px solid black;
            padding: 10px;
            margin: 5px;
            width: 100px;
            height: 50px;
            text-align: center;
            line-height: 50px;
        }

        .container-position {
            background-color: #e0e0ff;
            height: 200px;
            width: 300px;
            margin: 30px auto;
            border: 3px dashed blue;
        }

        .caixa-position {
            width: 80px;
            height: 80px;
            line-height: 80px;
            margin: 0;
        }

        .caixa1 {
            background-color: lightgreen;
        }

        .caixa2 {
            background-color: salmon;
        }

        .caixa3 {
            background-color: lightskyblue;
        }

        .menu-fixo {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            width: 100%;
        }
    </style>
</head>

<body>
    <section class="exercicio-position">
        <h3>Exercício 2: Position e z-index</h3>
        <div class="container-position">
            <div class="caixa-position caixa1">Caixa 1</div>
            <div class="caixa-position caixa2">Caixa 2</div>
            <div class="caixa-position caixa3">Caixa 3</div>
        </div>
        <p class="menu-fixo">Menu Fixo (Rolar para ver)</p>

        <div style="height: 1000px;"></div>
    </section>

</body>
</html>
