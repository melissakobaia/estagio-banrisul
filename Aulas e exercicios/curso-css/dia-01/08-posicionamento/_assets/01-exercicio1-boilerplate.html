<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercícios de Posicionamento e Display</title>
    <link rel="stylesheet" href="styles.css" />

    <style>
        /* estilos básicos */
        body {
            font-family: sans-serif;
            margin: 20px;
            padding-bottom: 200px;
        }

        h3 {
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
        }

        .caixa-display,
        .caixa-position {
            border: 1px solid black;
            padding: 10px;
            margin: 5px;
            width: 100px;
            height: 50px;
            text-align: center;
            line-height: 50px;
        }

        .exercicio-display {
            background-color: #f0f0f0;
            padding: 10px;
        }
    </style>
</head>

<body>
    <section class="exercicio-display">
        <h3>Exercício 1: Tipos de Exibição</h3>
        <p class="caixa-display item-a">Item A</p>
        <span class="caixa-display item-b">Item B</span>
        <div class="caixa-display item-c">Item C</div>
    </section>
</body>

</html>
